<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visibly</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon-32x32.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #03060f;
    --surface: #070c1a;
    --accent: #2563eb; 
    --accent-hover: #1d4ed8;
    --text: #ffffff;
    --muted: #8899a6;
    --border: rgba(255,255,255,0.08);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(37, 99, 235, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37, 99, 235, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  .orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; opacity: 0.6; }
  .orb1 { width: 600px; height: 600px; background: rgba(37, 99, 235, 0.15); top: -150px; left: -100px; }
  .orb2 { width: 500px; height: 500px; background: rgba(0, 229, 195, 0.05); bottom: 10%; right: -150px; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 6vw;
    backdrop-filter: blur(20px);
    background: rgba(3, 6, 15, 0.75);
    border-bottom: 1px solid var(--border);
  }

  .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .logo span { color: var(--accent); }

  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }

  .nav-toggle {
    display: none; background: none; border: none;
    color: var(--text); font-size: 1.5rem; cursor: pointer;
  }

  .nav-cta { 
    background: var(--accent); 
    color: #fff !important; 
    padding: 0.6rem 1.4rem; 
    border-radius: 8px; 
    font-size: 0.85rem !important; 
    font-weight: 600; 
    transition: background 0.2s !important;
  }
  .nav-cta:hover { background: var(--accent-hover); }

  section { position: relative; z-index: 1; padding: 6rem 6vw; max-width: 1100px; margin: 0 auto; text-align: center; }

  .hero {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8rem 6vw 4rem;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(37, 99, 235, 0.08); border: 1px solid rgba(37, 99, 235, 0.25);
    color: #5c93ff; font-size: 0.75rem; padding: 0.4rem 1.1rem;
    border-radius: 100px; margin-bottom: 2rem; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 600;
  }
  .hero-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #00e5c3; }

  h1 {
    font-weight: 800; font-size: clamp(2.2rem, 5vw, 4rem);
    line-height: 1.15; letter-spacing: -0.02em; max-width: 800px;
    color: #fff; margin-bottom: 1.5rem;
  }
  h1 span { color: #3b82f6; }

  .hero-sub { color: var(--muted); font-size: 1.1rem; max-width: 580px; line-height: 1.6; margin-bottom: 2.5rem; margin-left: auto; margin-right: auto; }
  
  .hero-actions { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; max-width: 340px; margin: 0 auto; }

  .btn-primary { 
    background: var(--accent); color: #fff; padding: 1rem 2rem; 
    border-radius: 10px; font-size: 0.95rem; font-weight: 600; 
    text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  
  .btn-secondary { 
    background: transparent; color: var(--text); padding: 1rem 2rem; 
    border-radius: 10px; font-size: 0.95rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.15);
    text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: background 0.2s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.05); }

  .stats { display: flex; justify-content: space-between; width: 100%; max-width: 650px; margin: 4rem auto 0; padding-top: 2.5rem; border-top: 1px solid var(--border); }
  .stat-item { flex: 1; text-align: center; position: relative; }
  .stat-item:not(:last-child)::after { content: ''; position: absolute; right: 0; top: 15%; height: 70%; width: 1px; background: var(--border); }
  .stat-icon { font-size: 1.2rem; color: #3b82f6; margin-bottom: 0.5rem; }
  .stat-num { font-size: 1.8rem; font-weight: 700; color: #fff; line-height: 1.2; }
  .stat-num span { color: var(--muted); font-size: 1rem; font-weight: 500; }
  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

  .hero-scroll-arrow { margin-top: 3rem; color: var(--accent); font-size: 1.5rem; animation: bounce 2s infinite; cursor: pointer; }
  @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-4px); } }

  .section-tag { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
  h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2.5rem; }

  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; text-align: left; }
  .service-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem; transition: border-color 0.2s; }
  .service-card:hover { border-color: rgba(37, 99, 235, 0.3); }
  .service-card .icon { font-size: 1.8rem; margin-bottom: 1rem; display: block; }
  .service-card h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
  .service-card p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .service-link { display: inline-block; margin-top: 1rem; font-size: 0.8rem; color: var(--accent); text-decoration: none; font-weight: 600; }

  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1rem; text-align: left; }
  .pricing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .pricing-card.popular { border-color: var(--accent); }
  .pricing-badge { position: absolute; top: 1rem; right: 1rem; background: rgba(37,99,235,0.15); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 100px; text-transform: uppercase; }
  .pricing-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
  .price { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
  .price span { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
  .pricing-card p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }
  
  .pricing-details { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
  .pricing-details h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
  .pricing-details ul { list-style: none; font-size: 0.85rem; color: var(--muted); }
  .pricing-details ul li { margin-bottom: 0.4rem; padding-left: 1rem; position: relative; }
  .pricing-details ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }

  .steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; text-align: left; }
  .step-card { padding: 1.5rem; border-left: 2px solid var(--border); transition: border-color 0.2s; }
  .step-card:hover { border-left-color: var(--accent); }
  .step-num { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; }
  .step-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
  .step-card p { color: var(--muted); font-size: 0.85rem; }

  .testimonials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; text-align: left; }
  .testi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; }
  .stars { color: #fbbf24; margin-bottom: 1rem; font-size: 0.9rem; }
  .testi-text { font-size: 0.9rem; color: #fff; font-style: italic; margin-bottom: 1.5rem; line-height: 1.6; }
  .author { display: flex; align-items: center; gap: 0.75rem; }
  .avatar { width: 36px; height: 36px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: var(--accent); }
  .author-info h4 { font-size: 0.85rem; font-weight: 600; }
  .author-info p { font-size: 0.75rem; color: var(--muted); }

  .faq-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 4rem; text-align: left; }
  .faq-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .faq-btn { width: 100%; text-align: left; background: none; border: none; padding: 1.2rem; color: #fff; font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; }
  .faq-panel { max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; background: rgba(255,255,255,0.01); }
  .faq-panel p { padding: 0 1.2rem 1.2rem; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

  .contact-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; max-width: 600px; margin: 0 auto; }
  .form-group { margin-bottom: 1.2rem; text-align: left; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: #fff; }
  .form-group input, .form-group textarea { width: 100%; background: #03060f; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; color: #fff; font-family: inherit; font-size: 0.9rem; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-submit { width: 100%; background: var(--accent); color: #fff; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
  .form-submit:hover { background: var(--accent-hover); }
